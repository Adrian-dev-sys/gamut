[package]
name = "gamut"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["http", "image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
gamut-core = { version = "0.1.0", path = "../core" }
log = "0.4.35"
open = "5.4.5"
raw-window-handle = "0.6.2"
rfd = "0.18.0"
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_SystemInformation"] }
avif-parse = "2.1.0"
avif-serialize = "0.8.9"
gilrs = "0.11.2"
hidapi = "2"

[build-dependencies]
winresource = "0.1"
